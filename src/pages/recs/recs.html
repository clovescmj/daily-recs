<!doctype html>
<html lang="en" class="recs-page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Recs</title>
<link rel="stylesheet" href="recs.css">
</head>
<body>
<main class="page">
  <header class="page-header">
    <div class="page-heading">
      <button type="button" id="play-all" class="play-all" aria-label="Play" title="Play" hidden><span class="play-all-icon" aria-hidden="true"></span></button>
      <div>
        <h1 class="page-title" id="page-title">Today's recommendations for you</h1>
        <p class="page-subtitle">New music every day, built from your own taste.</p>
      </div>
    </div>
    <div class="page-actions">
      <div class="view-switch" role="group" aria-label="Choose a list">
        <div class="tags-picker">
          <button type="button" id="view-tags" class="view-button" aria-haspopup="true" aria-expanded="false" aria-controls="tags-menu"></button>
          <div id="tags-menu" class="tags-menu" hidden></div>
        </div>
        <button type="button" id="view-best" class="view-button"></button>
        <button type="button" id="view-surprise" class="view-button"></button>
      </div>
    </div>
  </header>
  <section id="landing" class="landing" hidden>
    <h2 class="landing-title">What do you want to hear today?</h2>
    <p class="landing-subtitle">Pick a mood, or let us pick for you.</p>
    <div class="view-switch landing-options" role="radiogroup" aria-label="What do you want to hear today?">
      <div class="tags-picker">
        <button type="button" id="landing-tags-option" class="view-button" role="radio" aria-checked="false" aria-haspopup="true" aria-expanded="false" aria-controls="landing-tags" data-view="tags"></button>
        <div id="landing-tags" class="tags-menu" hidden></div>
      </div>
      <button type="button" id="landing-best-option" class="view-button is-active" role="radio" aria-checked="true" data-view="best"></button>
      <button type="button" id="landing-surprise-option" class="view-button" role="radio" aria-checked="false" data-view="surprise"></button>
    </div>
    <p id="landing-hint" class="landing-hint"></p>
    <button type="button" id="landing-go" class="button button--large">Start digging</button>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <section id="status" class="status-box" hidden></section>
  <section id="album-grid" class="album-grid" aria-label="Today's recommendations"></section>
  <nav class="page-footer" aria-label="Extension info"><span>v<span id="version">–</span></span> · <a href="../about/about.html" target="_blank" rel="noopener">About</a> · <a id="feedback-link" href="#" target="_blank" rel="noopener">Feedback</a> · <a id="bug-link" href="#" target="_blank" rel="noopener">Report a bug</a></nav>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
